name: apply-best

# One-shot: this container has no git credential, so changes ride in as patches.
# Deleted again before the PR is opened.
on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/parry-best'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply queued patches
        run: |
          applied=0
          for P in .github/best-*.patch; do
            [ -f "$P" ] || continue
            if git apply --check "$P"; then
              git apply "$P"
              applied=1
              echo "applied $P"
            else
              echo "skipped $P"
            fi
          done
          if [ "$applied" = "0" ]; then
            echo "nothing to apply"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(parry): keep the session's best on the result screen"
          git push
