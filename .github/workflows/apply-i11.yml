name: apply-i11

# One-shot: this container has no git credential, so changes ride in as patches.
# Deleted again before the PR is merged.
on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/bundles-parry-deployed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the queued patch
        run: |
          P=.github/i11.patch
          if [ ! -f "$P" ]; then
            echo "nothing queued"
            exit 0
          fi
          if ! git apply --check "$P"; then
            echo "::error::the patch does not apply; leaving the branch alone"
            exit 1
          fi
          git apply "$P" && git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(e2e): keep pressing while the enemy is in the window"
          git push
