name: Deploy pickup demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Not a list of packages: the hand-kept one went stale the day `glyph-arena-body` landed and
      # that package alone would not have redeployed the site.
      - "examples/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Every library, in dependency order — not a list. The list was hand-kept and went stale the
      # day `glyph-arena-body` landed: the runner could not build because its dist was missing, and
      # the site stopped deploying while `main` stayed green (the deploy is not a CI gate).
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm --filter @fogrexon/glyph-arena-pickup-demo build
        env:
          GITHUB_PAGES: "true"

      # The parry demo is published beside the frozen pickup demo, at /glyph-arena/parry/.
      - run: pnpm --filter @fogrexon/glyph-arena-parry-demo build
        env:
          PARRY_BASE: "/glyph-arena/parry/"

      # The runner slice is published at /glyph-arena/runner/.
      - run: pnpm --filter @fogrexon/glyph-arena-runner-demo build
        env:
          RUNNER_BASE: "/glyph-arena/runner/"

      # Where each demo is published comes from its own `package.json` (`glyphArenaPage`), not from a
      # list here: the day an example is added, a hand-kept list silently stops publishing it.
      - run: node scripts/assemble-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A record in the repository was a proxy for "the deploy landed", and it drifted: `main` stayed
  # green while Pages served a bundle two deploys old. So there is no record any more -- this job
  # compares the bundle this build produced with the bundle the live page names, and is red when
  # they differ. It commits nothing, so it cannot loop and does not need `main` (which is protected).
  verify-deployed:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The built demos, exactly as they were published.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact

      - run: mkdir -p pages && tar -xf pages-artifact/artifact.tar -C pages

      - name: compare the built bundles with what the site serves
        run: node scripts/check-served-bundles.mjs --site=pages --timeout=180 --interval=15
