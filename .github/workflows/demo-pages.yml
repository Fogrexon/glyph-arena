name: Deploy pickup demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/pickup-demo/**"
      - "examples/parry/**"
      - "examples/runner/**"
      - "docs/**"
      - "README.md"
      - "scripts/render-docs.mjs"
      - "scripts/docs/**"
      - "packages/glyph-arena-actions/**"
      - "packages/glyph-arena-assets/**"
      - "packages/glyph-arena-audio/**"
      - "packages/glyph-arena-camera/**"
      - "packages/glyph-arena-collide/**"
      - "packages/glyph-arena-draw/**"
      - "packages/glyph-arena-ecs/**"
      - "packages/glyph-arena-gamepad/**"
      - "packages/glyph-arena-input/**"
      - "packages/glyph-arena-loop/**"
      - "packages/glyph-arena-scene/**"
      - "packages/glyph-arena-timer/**"
      - "packages/glyph-arena-transform/**"
      - "packages/glyph-arena-tween/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Every library, in dependency order — not a list. The list was hand-kept and went stale the
      # day `glyph-arena-body` landed: the runner could not build because its dist was missing, and
      # the site stopped deploying while `main` stayed green (the deploy is not a CI gate).
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm --filter @fogrexon/glyph-arena-pickup-demo build
        env:
          GITHUB_PAGES: "true"

      # The parry demo is published beside the frozen pickup demo, at /glyph-arena/parry/.
      - run: pnpm --filter @fogrexon/glyph-arena-parry-demo build
        env:
          PARRY_BASE: "/glyph-arena/parry/"

      # The runner slice is published at /glyph-arena/runner/.
      - run: pnpm --filter @fogrexon/glyph-arena-runner-demo build
        env:
          RUNNER_BASE: "/glyph-arena/runner/"

      - run: |
          mkdir -p site/parry site/runner
          cp -r examples/pickup-demo/dist/. site/
          cp -r examples/parry/dist/. site/parry/
          cp -r examples/runner/dist/. site/runner/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The record used to be written by hand, after the deploy, by whoever remembered — and drifted
  # every time: `main` stayed green while the site served a bundle nobody had recorded. The deploy
  # is outside the CI gates, so it gets its own check, and the record gets an owner: this job.
  #
  # It cannot push to `main` (protection: PR required, `verify` required, admins included), and it
  # does not need to — `check:deployed --write --pr` opens a one-file PR, waits for `verify`, and
  # merges it with the same token. Two agreeing samples are required first, because Pages' CDN can
  # still be serving the previous release right after a deploy.
  record:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: record-bundles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: wait until the site serves one stable bundle per page
        run: |
          for attempt in $(seq 1 10); do
            first=$(node scripts/check-deployed-bundles.mjs --write --dry-run 2>/dev/null | sed -n 's/^--dry-run: would write .*: //p')
            sleep 20
            second=$(node scripts/check-deployed-bundles.mjs --write --dry-run 2>/dev/null | sed -n 's/^--dry-run: would write .*: //p')
            if [ -n "$first" ] && [ "$first" = "$second" ]; then
              echo "settled on $second"
              exit 0
            fi
            echo "attempt $attempt: '$first' then '$second' — the site is still moving"
          done
          echo "::error::the site never served a stable set of bundles; the record was not written"
          exit 1

      - name: write the record and take it to main through a PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-deployed-bundles.mjs --write --pr

      - name: the site and the record agree
        run: node scripts/check-deployed-bundles.mjs
