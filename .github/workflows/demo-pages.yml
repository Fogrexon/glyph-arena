name: Deploy pickup demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/pickup-demo/**"
      - "packages/glyph-arena-actions/**"
      - "packages/glyph-arena-camera/**"
      - "packages/glyph-arena-collide/**"
      - "packages/glyph-arena-draw/**"
      - "packages/glyph-arena-input/**"
      - "packages/glyph-arena-loop/**"
      - "packages/glyph-arena-scene/**"
      - "packages/glyph-arena-timer/**"
      - "packages/glyph-arena-transform/**"
      - "packages/glyph-arena-tween/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @fogrexon/glyph-arena-actions build
      - run: pnpm --filter @fogrexon/glyph-arena-camera build
      - run: pnpm --filter @fogrexon/glyph-arena-collide build
      - run: pnpm --filter @fogrexon/glyph-arena-draw build
      - run: pnpm --filter @fogrexon/glyph-arena-input build
      - run: pnpm --filter @fogrexon/glyph-arena-loop build
      - run: pnpm --filter @fogrexon/glyph-arena-scene build
      - run: pnpm --filter @fogrexon/glyph-arena-timer build
      - run: pnpm --filter @fogrexon/glyph-arena-transform build
      - run: pnpm --filter @fogrexon/glyph-arena-tween build
      - run: pnpm --filter @fogrexon/glyph-arena-pickup-demo build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/pickup-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
