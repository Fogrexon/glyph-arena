name: apply-t

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/bundle-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          applied=0
          for P in .github/t*.patch; do
            [ -f "$P" ] || continue
            if git apply --check "$P"; then git apply "$P"; applied=1; echo "applied $P"; else echo "skipped $P"; fi
          done
          if [ "$applied" = "0" ]; then echo "nothing"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runner): a respawn starts grounded"
          git push
