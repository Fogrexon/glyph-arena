name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before anything is built: `pnpm pack` from a checkout with no dist/ must still produce a
      # package that can be imported. It did not — `files: ["dist"]` with no `prepack` packed
      # LICENSE, README and package.json and exited 0. `smoke:pack-install` cannot see it, because
      # it runs after `pnpm -r build`; this is the only step that stands where a new user stands.
      - run: pnpm check:pack

      # typecheck comes FIRST on purpose. With `paths` in tsconfig.base.json
      # it resolves the packages from src/, so it needs no build — and keeping
      # it ahead of build is the only thing that keeps proving that. Move it
      # after build and a future paths regression hides behind dist/.
      - run: pnpm -r typecheck

      # build second: the two checks below, the smoke test and the demo bundle
      # all read dist/.
      - run: pnpm -r build

      # Two checks that survive tsconfig paths mapping sources into
      # `pnpm -r typecheck`: package.json must point at files that exist, and
      # the emitted declarations must still carry the public API.
      - run: pnpm check:package-entry-points

      # The umbrella README ships inside the tarball and is frozen there until the next
      # version, so it is the one hand-kept list nobody can fix after the fact. The check
      # reads `packages/` instead of a list: it fails on a stated module count, on a module
      # that is not named, and on a README whose examples never draw anything.
      - run: pnpm check:readme

      - run: pnpm typecheck:public-api

      # Packs every package, installs the tarballs into an empty project
      # offline, and typechecks a strict consumer against them. No registry is
      # contacted; S4 in the script proves the check actually reads types.
      - run: pnpm smoke:pack-install

      # The deploy check's pure parts: which bundle a built page names, what a
      # page's URL is, and that a served bundle older than the built one is a
      # failure. The network half runs in the deploy workflow, against Pages.
      - run: pnpm test:scripts

      - run: pnpm -r test

      # 8. The demo in a real browser: the 3 s hazard grace, "standing still
      # gets you hit", the dash burst and touch start + d-pad, all read off the
      # running canvas. Offline — it serves the built dist from 127.0.0.1 and
      # drives the runner's preinstalled Chrome through playwright-core (no
      # browser download). Assertions are made in simulated time, so the run
      # takes longer on a slow machine but reaches the same verdict.
      - run: pnpm e2e:demo

      # 9. The runner slice's acceptance: the three things only a browser can
      # settle — ① you survive the first second of running (grounded stays
      # true, the camera moves into the world), ② a death puts you back on
      # ground within the spec's 0.6 s and obeys the spike/pit rule, ③ the
      # touch pads move you exactly as fast as the keyboard. It reads
      # `window.__runnerState` and asserts the shipped constants still equal
      # the spec (760 / 2600 / 0.09 / 0.12), so a relaxed number fails here
      # instead of passing quietly. Offline, same as step 8. While
      # `examples/runner/dist` does not exist it reports PEND lines — pending
      # is counted separately from passing, never as one.
      - run: pnpm e2e:runner

      # 10. The tutorial's "The whole file" block, which is the only path a
      # reader outside this repo walks: copy it, import `@fogrexon/glyph-arena`,
      # run it. Steps 5 and 6 already compile it — the block is the source of a
      # real workspace package (`fixtures/tutorial`) whose typecheck and build
      # scripts extract it from `docs/tutorial.md` first — so a docs edit that
      # does not typecheck goes red there. This step covers what a compiler
      # cannot: the built page is served from 127.0.0.1 and the canvas is read,
      # so "the frame painted", "frames keep coming", and "holding right moves
      # the body through the world" (input reaches the body step) are checked.
      # Both breakages that reached readers this week compiled fine.
      - run: pnpm e2e:tutorial
