<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph Arena tutorial — the pad</title>
    <!--
      The phone program looks up `#game`, so this page has one: the generated `phone-pad.ts` is the
      tutorial's phone program verbatim plus one `export`, which is what lets the gate probe `buildPad`
      at widths the running page is not using.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1626;
      }
      /*
       * The canvas fills the page, which is the point: a game is told its bitmap in device pixels
       * and its CSS box by the page, and the two are the same only at ratio 1. `display: block`
       * alone leaves the box at the bitmap's size, so a ratio-3 phone lays the pad out over three
       * times the thumb's reach — 100% is what makes `units()` mean "the window".
       */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="./phone.ts"></script>
  </body>
</html>
