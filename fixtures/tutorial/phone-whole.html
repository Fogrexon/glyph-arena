<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph Arena tutorial — the whole file, on a phone</title>
    <!--
      The same shell as `index.html`, because the phone program is the same program: it looks up
      `#game` and expects the page to have nothing else. The gate opens this page in a 390×844 touch
      viewport with DPR 3 and drives it with a thumb.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1626;
      }
      /*
       * The canvas fills the page, which is the point: a game is told its bitmap in device pixels
       * and its CSS box by the page, and the two are the same only at ratio 1. `display: block`
       * alone leaves the box at the bitmap's size, so a ratio-3 phone lays the pad out over three
       * times the thumb's reach — 100% is what makes `units()` mean "the window".
       */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="./phone-whole.ts"></script>
  </body>
</html>
